# https://github.com/dmmulroy/.dotfiles/blob/main/home/.config/tmux/tmux.conf
set -s escape-time 0
set -g history-limit 50000
set -g display-time 4000
set -g status-interval 5

# set -g default-terminal 'screen-256color'
set -g default-terminal 'screen-256color'

set -sa terminal-overrides ',xterm-256color:RGB'
set -s terminal-features 'xterm*:clipboard:ccolour:cstyle:focus:title:extkeys'
set -as terminal-features 'screen*:title'
set -as terminal-features 'rxvt*:ignorefkeys'

set -s extended-keys always
set -s extended-keys-format csi-u
set -sa terminal-features 'exterm*:extkeys'

set -g prefix C-a
unbind C-b
bind C-a send-prefix

unbind %
bind | split-window -hc "#{pane_current_path}"
unbind '"'
bind _ split-window -vc "#{pane_current_path}"

bind R source-file ~/.config/tmux/tmux.conf \; display 'reloaded'

bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r h resize-pane -L 5
bind -r m resize-pane -Z
bind -r ^ last-window

set -g mouse on

set-window-option -g mode-keys vi
set -g set-clipboard on

bind-key -T copy-mode-vi 'v' send -X begin-selection 
bind-key -T copy-mode-vi 'y' send -X copy-selection 
unbind -T copy-mode-vi MouseDragEnd1Pane

# change tmux plugins install path
set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.config/tmux/plugins' 

set -g @plugin 'tmux-plugins/tpm'

set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'thewtex/tmux-mem-cpu-load'

set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @resurrect-strategy-vim 'session'      # Restore vim sessions
set -g @resurrect-strategy-nvim 'session'     # Restore neovim sessions
set -g @resurrect-capture-pane-contents 'on'  # Save pane contents

set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'         # Auto-restore last saved session
set -g @continuum-boot 'on'            # Auto-start tmux on boot
set -g @continuum-save-interval '10'   # Save every 10 minutes

run "~/.config/tmux/theme.tmux"
run '~/.config/tmux/plugins/tpm/tpm'
